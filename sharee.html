<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Innovators Summit 2023</title>

  <!-- Open Graph meta tags for sharing -->
  <meta property="og:title" content="Tech Innovators Summit 2023">
  <meta property="og:description" content="Join the biggest gathering of tech enthusiasts, innovators, and industry leaders!">
  <meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=Tech+Innovators+Summit+2023">
  <meta property="og:url" content="https://aashishdev01.github.io/e-coomerce-website/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Tech Innovators Summit 2023">
  <meta name="twitter:description" content="Join the biggest gathering of tech enthusiasts, innovators, and industry leaders!">
  <meta name="twitter:image" content="IMG/TATASALT.jpg">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f0f0f0;
    }
    h1 {
      color: #2E3192;
    }
    p {
      font-size: 1.2rem;
    }
    img {
      max-width: 100%;
      height: auto;
      margin: 20px 0;
      border-radius: 10px;
    }
    .share-btn {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 12px 25px;
      font-size: 1.2rem;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.3s;
      margin-top: 20px;
    }
    .share-btn:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>
<body>

  <h1>Tech Innovators Summit 2023</h1>
  <p>Join the biggest gathering of tech enthusiasts, innovators, and industry leaders!</p>

  <!-- Event image -->
  <img src="IMG/TATASALT.jpg" alt="Tech Innovators Summit">

  <!-- WhatsApp Share Button -->
  <a href="#" class="share-btn" id="whatsappShare">Share on WhatsApp</a>

  <script>
    const whatsappBtn = document.getElementById('whatsappShare');
    const message = encodeURIComponent(
      "Join me at Tech Innovators Summit 2023! " + 
      "https://aashishdev01.github.io/e-coomerce-website/"
    );

    whatsappBtn.addEventListener('click', () => {
      const whatsappUrl = `https://api.whatsapp.com/send?text=${message}`;
      window.open(whatsappUrl, '_blank');
    });
  </script>

</body>
</html>
