<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buy Now - E-Commerce</title>

  <!-- Open Graph meta tags for social sharing -->
  <meta property="og:title" content="Buy Now - E-Commerce">
  <meta property="og:description" content="Check out our amazing products and deals!">
  <meta property="og:image" content="https://via.placeholder.com/1200x630.png?text=Buy+Now+E-Commerce+Banner">
  <meta property="og:url" content="https://aashishdev01.github.io/e-coomerce-website/">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Buy Now - E-Commerce">
  <meta name="twitter:description" content="Check out our amazing products and deals!">
  <meta name="twitter:image" content="https://via.placeholder.com/1200x630.png?text=Buy+Now+E-Commerce+Banner">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background: #f0f0f0;
    }
    h1 {
      color: #2E3192;
    }
    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    img {
      max-width: 100%;
      height: auto;
      margin-bottom: 20px;
      border-radius: 10px;
    }
    .share-btn {
      display: inline-block;
      background-color: #25D366;
      color: white;
      padding: 12px 25px;
      font-size: 1.2rem;
      border-radius: 50px;
      text-decoration: none;
      transition: background 0.3s;
    }
    .share-btn:hover {
      background-color: #1ebe5d;
    }
  </style>
</head>
<body>

  <h1>Buy Now - E-Commerce Website</h1>
  <p>Check out our amazing products and deals!</p>

  <!-- Event / Product Image -->
  <img src="https://via.placeholder.com/600x315.png?text=Buy+Now+E-Commerce+Banner" alt="Buy Now Banner">

  <!-- WhatsApp Share Button -->
  <a href="#" class="share-btn" id="whatsappShare">Share on WhatsApp</a>

  <script>
    const whatsappBtn = document.getElementById('whatsappShare');
    const message = encodeURIComponent(
      "Check out this amazing e-commerce website! " +
      "https://aashishdev01.github.io/e-coomerce-website/"
    );

    whatsappBtn.addEventListener('click', () => {
      const whatsappUrl = `https://api.whatsapp.com/send?text=${message}`;
      window.open(whatsappUrl, '_blank');
    });
  </script>

</body>
</html>
